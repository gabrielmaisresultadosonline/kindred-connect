<!DOCTYPE html>
<html lang="pt-br">

        .logo { color: #128c7e; font-weight: 800; margin-bottom: 30px; }
        .btn-custom { background: #128c7e; color: white; border-radius: 10px; padding: 12px; width: 100%; border: none; font-weight: bold; }
    </style>
</head>
<body>
