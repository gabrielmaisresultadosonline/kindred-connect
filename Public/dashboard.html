<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAPMRO | CRM & AI Profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #128c7e; --secondary: #075e54; --bg: #f0f2f5; }
        body { background: var(--bg); height: 100vh; display: flex; font-family: sans-serif; }
        .sidebar-nav { width: 70px; background: #202c33; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 25px; color: #aebac1; }
        .sidebar-nav i { font-size: 24px; cursor: pointer; transition: 0.3s; }
        .sidebar-nav i:hover, .sidebar-nav i.active { color: #fff; }
        
        .panel { flex: 1; display: flex; overflow: hidden; }
        .chat-list-panel { width: 350px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .content-panel { flex: 1; background: #e5ddd5; position: relative; display: flex; flex-direction: column; }
        
        .kanban-view { display: none; flex: 1; padding: 20px; overflow-x: auto; gap: 20px; }
        .kanban-col { min-width: 300px; background: #ebedef; border-radius: 10px; padding: 15px; }
        
        .active-tab { display: flex !important; }
        .qr-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; color: #fff; }
    </style>
</head>
<body>
    <div id="qrOverlay" class="qr-overlay">
        <div class="bg-white p-4 rounded text-center text-dark">
            <h4>Conectar WhatsApp</h4>
            <img id="qrImg" style="width:250px;">
            <p class="mt-2 text-muted">Escaneie para ativar a IA e Fluxos</p>
        </div>
    </div>

    <div class="sidebar-nav">
        <i class="fas fa-comment-dots active" onclick="showTab('chat')"></i>
        <i class="fas fa-columns" onclick="showTab('kanban')"></i>
        <i class="fas fa-robot" onclick="showTab('ai')"></i>
        <i class="fas fa-clock" onclick="showTab('agenda')"></i>
        <i class="fas fa-sign-out-alt mt-auto" onclick="logout()"></i>
    </div>

    <div class="panel">
        <!-- ABA CHAT -->
        <div id="tab-chat" class="panel active-tab">
            <div class="chat-list-panel">
                <div class="p-3 bg-light d-flex justify-content-between">
                    <h5 class="m-0">Conversas</h5>
                    <button class="btn btn-sm btn-success" onclick="connect()"><i class="fas fa-sync"></i></button>
                </div>
                <div id="chatList" class="overflow-auto"></div>
            </div>
            <div class="content-panel">
                <div id="chatHeader" class="p-3 bg-white border-bottom fw-bold">Selecione um chat</div>
                <div id="msgs" class="flex-grow-1 p-3 overflow-auto d-flex flex-column gap-2"></div>
                <div class="p-3 bg-light d-flex gap-2">
                    <input type="text" id="msgInp" class="form-control" placeholder="Mensagem...">
                    <button onclick="send()" class="btn btn-success"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- ABA KANBAN -->
        <div id="tab-kanban" class="kanban-view">
            <div class="kanban-col">
                <h6>Lead <button class="btn btn-sm float-end">+</button></h6>
                <div id="col-lead" class="mt-3 d-flex flex-column gap-2"></div>
            </div>
            <div class="kanban-col">
                <h6>Em Atendimento</h6>
                <div id="col-prog" class="mt-3 d-flex flex-column gap-2"></div>
            </div>
            <div class="kanban-col">
                <h6>Finalizado</h6>
                <div id="col-done" class="mt-3 d-flex flex-column gap-2"></div>
            </div>
        </div>

        <!-- ABA IA -->
        <div id="tab-ai" class="panel p-5 bg-white flex-column gap-3" style="display:none;">
            <h3>Configuração de IA</h3>
            <div class="mb-3">
                <label>OpenAI API Key</label>
                <input type="password" id="aiKey" class="form-control">
            </div>
            <div class="mb-3">
                <label>Prompt da IA</label>
                <textarea id="aiPrompt" class="form-control" rows="4"></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveAI()">Salvar Configuração</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        const sid = user.id;
        const socket = io();
        let active = null;

        socket.emit('join', sid);
        socket.on('qr', src => { document.getElementById('qrOverlay').style.display='flex'; document.getElementById('qrImg').src=src; });
        socket.on('ready', () => { document.getElementById('qrOverlay').style.display='none'; loadChats(); });
        socket.on('new-message', m => { if(m.from===active || m.fromMe) append(m); });

        function showTab(t) {
            document.querySelectorAll('.panel, .kanban-view').forEach(p => p.classList.remove('active-tab'));
            document.getElementById('tab-'+t).classList.add('active-tab');
        }

        async function connect() { fetch('/api/whatsapp/connect', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId:sid})}); }
        
        async function loadChats() {
            const r = await fetch('/api/whatsapp/chats?sessionId='+sid);
            const chats = await r.json();
            document.getElementById('chatList').innerHTML = chats.map(c => `
                <div class="p-3 border-bottom cursor-pointer d-flex align-items-center gap-3" onclick="sel('${c.id}','${c.name}')">
                    <img src="${c.pic}" style="width:40px; border-radius:50%">
                    <div><div class="fw-bold">${c.name||c.id}</div><div class="small text-muted">Clique para abrir</div></div>
                </div>
            `).join('');
        }

        function sel(id, name) { active=id; document.getElementById('chatHeader').innerText=name||id; document.getElementById('msgs').innerHTML=''; }

        function send() {
            const v = document.getElementById('msgInp').value;
            if(!v || !active) return;
            fetch('/api/whatsapp/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId:sid, to:active, message:v})});
            append({body:v, fromMe:true});
            document.getElementById('msgInp').value='';
        }

        function append(m) {
            const d = document.createElement('div');
            d.className = `p-2 rounded ${m.fromMe?'bg-success text-white align-self-end':'bg-white align-self-start'}`;
            d.style.maxWidth = '70%';
            d.innerText = m.body;
            document.getElementById('msgs').appendChild(d);
            document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        }

        function logout() { localStorage.clear(); window.location.href='index.html'; }
        
        connect();
    </script>
</body>
</html>
